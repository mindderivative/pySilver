[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pysilver"
version = "1.7.0"
description = "A GPU-accelerated declarative desktop GUI framework for Python"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/pysilver/assets/fonts/LICENSE-*.txt"]
requires-python = ">=3.12"
authors = [{ name = "phil" }]
keywords = ["gui", "desktop", "wgpu", "webgpu", "material-design", "declarative"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]

dependencies = [
    # windowing + graphics
    "wgpu>=0.32,<0.33",
    "rendercanvas>=2.7,<3",
    "glfw>=2.10",
    # data + validation
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "PyYAML>=6.0",
    "numpy>=2.0",
    # styling
    "materialyoucolor>=3.0,<4",
    "pillow>=11",
    # text stack (see ARCHITECTURE.md 2.3.1)
    "uharfbuzz>=0.56",
    "freetype-py>=2.5",
    "fonttools>=4.60",
    "python-bidi>=0.6",
    "uniseg>=0.10",
    # concurrency + tooling
    "anyio>=4.0",
    "watchfiles>=1.0",
]

[project.optional-dependencies]
# The screen-reader bridge. A native wheel, and only worth installing for an
# application that wants one -- so it is an extra rather than a dependency.
# AccessKit ships its Windows and macOS adapters in their own platform wheels;
# the Linux wheel carries the AT-SPI adapter this uses.
a11y = ["accesskit>=0.7,<0.8"]
# SVG icon compilation (text/svgicons.py). Only needed by an application that
# calls compile_svg_font/load_svg_icons -- everything else in pySilver,
# including Material Symbols, needs no SVG parser at all.
svg = ["svgelements>=1.9,<2"]
# CodeEditor's syntax highlighting (widgets/codeeditor.py). Lazily imported --
# a CodeEditor with no `style.language` set, or this extra not installed,
# still works as a plain editable multi-line text control, just uncoloured.
code = ["pygments>=2.18,<3"]
# Terminal (widgets/terminal.py). bittty is WTFPL -- an optional extra, never
# a hard dependency, the same rule accesskit's own licence follows. Replaced
# `pyte` here (2026-09-08): a real `pyte` parsing defect corrupted typed
# input under zsh-syntax-highlighting, reproduced with pySilver's code not
# even involved -- see the widget's own module docstring. Only a real POSIX
# pseudo-terminal (pexpect, ISC) is implemented and verified in this pass;
# Windows would need pywinpty (MIT) wrapping ConPTY, which is architected
# for but not yet built.
terminal = [
    "bittty>=0.2,<1",
    "pexpect>=4.9,<5; sys_platform != 'win32'",
]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "accesskit>=0.7,<0.8",
    "svgelements>=1.9,<2",
    "pygments>=2.18,<3",
    "bittty>=0.2,<1",
    "pexpect>=4.9,<5; sys_platform != 'win32'",
]

[project.urls]
Homepage = "https://github.com/mindderivative/pySilver"
Source = "https://github.com/mindderivative/pySilver"
Issues = "https://github.com/mindderivative/pySilver/issues"
Architecture = "https://github.com/mindderivative/pySilver/blob/main/ARCHITECTURE.md"

[tool.hatch.build.targets.wheel]
packages = ["src/pysilver"]

[tool.hatch.build.targets.sdist]
# Ship what someone needs to build, test, and understand the package. Tooling
# caches, agent instructions, and CI config are not that -- and `M3-References`
# is 2.2MB of third-party material that is gitignored and must never ship.
include = [
    "/src/pysilver",
    "/tests",
    "/examples",
    "/README.md",
    "/ARCHITECTURE.md",
    "/LICENSE",
    "/pyproject.toml",
]

# ---------------------------------------------------------------- tooling

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "gpu: requires a working wgpu adapter (deselect with '-m \"not gpu\"')",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["N803", "N806"]  # graphics math uses conventional capitalised names

[tool.ruff.lint.per-file-ignores]
# MVVM names a ViewModel module `*_ViewModel.py`; PEP 8 says module names are
# lower case. Those genuinely conflict, and this picks the convention a reader
# coming from MVVM will recognise. The framework accepts either casing, so a
# project that would rather satisfy N999 can use `*_viewmodel.py` instead.
"**/*_ViewModel.py" = ["N999"]

[[tool.mypy.overrides]]
# accesskit is a native wheel with no py.typed marker. Scoped to the one
# module that imports it, so a missing stub elsewhere still fails.
module = ["accesskit", "accesskit.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Pygments ships no inline types; a types-Pygments stub package exists on
# PyPI, but adding it as a dev dependency for one lazily-imported, optional
# module (widgets/codeeditor.py) is not worth it. Same reasoning as
# accesskit above.
module = ["pygments", "pygments.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# bittty and pexpect ship no inline types (no py.typed marker, checked
# directly). Same reasoning as accesskit/pygments above -- scoped to the one
# lazily-imported, optional module that uses them (widgets/terminal.py).
module = ["bittty", "bittty.*", "pexpect", "pexpect.*"]
ignore_missing_imports = true

[tool.mypy]
python_version = "3.12"
packages = ["pysilver"]
strict = true
warn_unreachable = true
enable_error_code = ["explicit-override"]

[[tool.mypy.overrides]]
module = ["wgpu.*", "rendercanvas.*", "materialyoucolor.*", "freetype.*", "uharfbuzz.*", "uniseg.*", "bidi.*", "glfw.*", "fontTools.*", "svgelements.*"]
ignore_missing_imports = true
