name: root
widget: ScrollView
style: {width: expand, height: expand}
children:
  - widget: Vertical
    style:
      background: surface
      padding: 32
      spacing: 20
      width: expand
      cross_alignment: stretch
    children:
      - name: title
        widget: Text
        text: "User Test Window"
        style: {text_style: headline-large, color: on_surface}

      - {name: div1, widget: Divider, style: {width: expand}}

      - widget: Vertical
        style:
          background: surface
          padding: 0
          spacing: 20
          width: expand
          cross_alignment: stretch
        children:
          - name: test01
            widget: Text
            text: |
              The morning sun rose slowly over the quiet hills, casting a warm golden light across the dewy grass. A gentle breeze rustled the leaves of the tall oak trees, waking the forest birds from their quiet slumber. Down by the winding river, a small group of deer gathered to drink, their alert eyes scanning the surrounding trees for any signs of movement. Nature moved with a calm and steady rhythm, untouched by the rush of the modern world far away.
