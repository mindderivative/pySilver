name: root
widget: ScrollView
style: {width: expand, height: expand}
children:
  - widget: Vertical
    style:
      background: surface
      padding: 32
      spacing: 20
      width: expand
      cross_alignment: stretch
    children:
      - name: title
        widget: Text
        text: "Canvas"
        style: {text_style: headline-small, color: on_surface}

      - name: summary
        widget: Text
        text: "Not an M3 component: a freeform drawing surface for application-drawn content that doesn't hold still long enough to be data."
        style: {text_style: body-large, color: on_surface_variant}

      - {name: div1, widget: Divider, style: {width: expand}}

      - name: explanation
        widget: Text
        text: |
          Checked directly against M3, which has nothing named Canvas.
          Everything else in a view file is data, but a Canvas exists
          precisely for content that changes every frame -- a live
          chart, a custom gauge -- where stacking N declared shapes
          would fight reconciliation rather than use it. A view names
          `on_paint:`; the handler receives a drawing context and issues
          primitives against it directly, the same shape Flutter's
          CustomPainter and HTML5's `<canvas>` both use. Only primitives
          the shader already has a branch for are exposed: a stroked
          line, a filled rect, a filled circle, a stroked arc, a regular
          polygon, and text.

          Use cases: a data-driven visualization or custom drawing whose
          content is computed at runtime rather than declared once in a
          view file.
        style: {text_style: body-medium, color: on_surface_variant}

      - {name: div2, widget: Divider, style: {width: expand}}

      - name: live_heading
        widget: Text
        text: "Live example"
        style: {text_style: title-medium, color: primary}

      - name: live_demo
        widget: Canvas
        style: {width: 480, height: 120, background: surface_container_low, corner_radius: 8}
        handlers: {on_paint: draw}

      - {name: div3, widget: Divider, style: {width: expand}}

      - name: code_heading
        widget: Text
        text: "Source"
        style: {text_style: title-medium, color: primary}

      - name: code_panels
        widget: Horizontal
        style: {spacing: 16, width: expand, height: 260}
        children:
          - name: yaml_source
            widget: CodeEditor
            value: "{{ view_source }}"
            style: {width: expand, height: expand, language: yaml, read_only: true}
          - name: python_source
            widget: CodeEditor
            value: "{{ viewmodel_source }}"
            style: {width: expand, height: expand, language: python, read_only: true}
