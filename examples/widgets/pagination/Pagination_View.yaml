name: root
widget: ScrollView
style: {width: expand, height: expand}
children:
  - widget: Vertical
    style:
      background: surface
      padding: 32
      spacing: 20
      width: expand
      cross_alignment: stretch
    children:
      - name: title
        widget: Text
        text: "Pagination"
        style: {text_style: headline-small, color: on_surface}

      - name: summary
        widget: Text
        text: "Not an M3 component: prev/next arrows around a row of page numbers."
        style: {text_style: body-large, color: on_surface_variant}

      - {name: div1, widget: Divider, style: {width: expand}}

      - name: explanation
        widget: Text
        text: |
          Checked directly, not assumed missing: "pagination" appears in
          the whole reference library exactly once, only as a
          prohibition on Cards. Anatomy borrows `IconButton`'s own for
          the arrows and unselected numbers, and the same selected
          pairing `Chip`/`Segment` use for the current page.
          `value:` is the current page, 1-indexed; `style.count` is the
          total. Windowing (since nothing sources one either): always
          show the first and last page and the current page's immediate
          neighbours, collapsing the rest into "...".

          Use cases: navigating a long, discrete list of pages -- search
          results, a data table -- where jumping directly to page 7 is
          more useful than scrolling through 6 first.
        style: {text_style: body-medium, color: on_surface_variant}

      - {name: div2, widget: Divider, style: {width: expand}}

      - name: live_heading
        widget: Text
        text: "Live example"
        style: {text_style: title-medium, color: primary}

      - name: live_demo
        widget: Horizontal
        style: {spacing: 16}
        children:
          - {name: pages, widget: Pagination, value: "{{ page.get() }}", style: {count: 12}, handlers: {on_change: change_page}}
          - widget: Text
            text: "Page {{ page.get() }} of 12"
            style: {color: on_surface_variant}

      - {name: div3, widget: Divider, style: {width: expand}}

      - name: code_heading
        widget: Text
        text: "Source"
        style: {text_style: title-medium, color: primary}

      - name: code_panels
        widget: Horizontal
        style: {spacing: 16, width: expand, height: 260}
        children:
          - name: yaml_source
            widget: CodeEditor
            value: "{{ view_source }}"
            style: {width: expand, height: expand, language: yaml, read_only: true}
          - name: python_source
            widget: CodeEditor
            value: "{{ viewmodel_source }}"
            style: {width: expand, height: expand, language: python, read_only: true}
