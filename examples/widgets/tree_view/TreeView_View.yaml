name: root
widget: ScrollView
style: {width: expand, height: expand}
children:
  - widget: Vertical
    style:
      background: surface
      padding: 32
      spacing: 20
      width: expand
      cross_alignment: stretch
    children:
      - name: title
        widget: Text
        text: "Tree View"
        style: {text_style: headline-small, color: on_surface}

      - name: summary
        widget: Text
        text: "Not an M3 component: Lists' expand/collapse behaviour applied recursively, with selection at any depth."
        style: {text_style: body-large, color: on_surface_variant}

      - {name: div1, widget: Divider, style: {width: expand}}

      - name: explanation
        widget: Text
        text: |
          The same source Accordion has, applied recursively: "List
          items containing other list items can expand and collapse in
          a folder-like manner". TreeView reuses the same selection-
          container shape every other container in the framework does --
          `value:` names the selected item -- but overrides how
          selection is applied, since a tree's selected item can sit at
          any depth, not just among direct children. This page is about
          the container's own selection behaviour; each node's own
          anatomy (indentation, the chevron, expand state) has its own
          demo under Tree Item.
        style: {text_style: body-medium, color: on_surface_variant}

      - {name: div2, widget: Divider, style: {width: expand}}

      - name: live_heading
        widget: Text
        text: "Live example -- click src or widgets/ to collapse them"
        style: {text_style: title-medium, color: primary}

      - name: live_demo
        widget: TreeView
        value: "{{ selected.get() }}"
        style: {width: expand}
        children:
          - name: src
            widget: TreeItem
            text: "src"
            value: "{{ src_expanded.get() }}"
            handlers: {on_click: toggle_src}
            children:
              - name: widgets_dir
                widget: TreeItem
                text: "widgets/"
                value: "{{ widgets_expanded.get() }}"
                handlers: {on_click: toggle_widgets}
                children:
                  - {name: base_py, widget: TreeItem, text: "base.py", handlers: {on_click: select}}
                  - {name: material_py, widget: TreeItem, text: "material.py", handlers: {on_click: select}}
              - {name: main, widget: TreeItem, text: "main.py", handlers: {on_click: select}}
          - {name: readme, widget: TreeItem, text: "README.md", handlers: {on_click: select}}

      - widget: Text
        text: "Selected, at whatever depth: {{ selected.get() }}"
        style: {color: on_surface_variant}

      - {name: div3, widget: Divider, style: {width: expand}}

      - name: code_heading
        widget: Text
        text: "Source"
        style: {text_style: title-medium, color: primary}

      - name: code_panels
        widget: Horizontal
        style: {spacing: 16, width: expand, height: 260}
        children:
          - name: yaml_source
            widget: CodeEditor
            value: "{{ view_source }}"
            style: {width: expand, height: expand, language: yaml, read_only: true}
          - name: python_source
            widget: CodeEditor
            value: "{{ viewmodel_source }}"
            style: {width: expand, height: expand, language: python, read_only: true}
