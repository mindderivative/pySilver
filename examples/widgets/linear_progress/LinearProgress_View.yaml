name: root
widget: ScrollView
style: {width: expand, height: expand}
children:
  - widget: Vertical
    style:
      background: surface
      padding: 32
      spacing: 20
      width: expand
      cross_alignment: stretch
    children:
      - name: title
        widget: Text
        text: "Linear Progress"
        style: {text_style: headline-small, color: on_surface}

      - name: summary
        widget: Text
        text: "M3's linear progress indicator: a 4dp track with rounded ends, determinate or indeterminate."
        style: {text_style: body-large, color: on_surface_variant}

      - {name: div1, widget: Divider, style: {width: expand}}

      - name: explanation
        widget: Text
        text: |
          Omitting `value:` selects the indeterminate form, which M3
          describes as moving "along a fixed track, growing and shrinking
          in size". Supplying a value (0.0 to 1.0) makes it determinate;
          M3 notes an indicator should switch from indeterminate to
          determinate as real information arrives, which is just binding
          `value:` to a signal that starts empty. Colour roles are shared
          with `CircularProgress`: active `primary`, track
          `secondary_container`.

          Use cases, from the spec: use progress indicators to show the
          status of ongoing processes, such as loading an app, submitting
          a form, or saving updates. When multiple items are loading, use
          a single indicator for the whole group rather than one per item.
        style: {text_style: body-medium, color: on_surface_variant}

      - {name: div2, widget: Divider, style: {width: expand}}

      - name: live_heading
        widget: Text
        text: "Live example"
        style: {text_style: title-medium, color: primary}

      - name: live_demo
        widget: Vertical
        style: {spacing: 16, width: expand}
        children:
          - {widget: Text, text: "Indeterminate", style: {color: on_surface_variant}}
          - {name: indeterminate, widget: LinearProgress, style: {width: expand}}
          - {widget: Text, text: "Determinate", style: {color: on_surface_variant}}
          - {name: determinate, widget: LinearProgress, value: "{{ progress.get() }}", style: {width: expand}}
          - name: controls
            widget: Horizontal
            style: {spacing: 8}
            children:
              - {widget: Button, text: "-10%", style: {variant: outlined}, handlers: {on_click: decrease}}
              - {widget: Button, text: "+10%", style: {variant: filled_tonal}, handlers: {on_click: increase}}
              - widget: Text
                text: "{{ percent.get() }}%"
                style: {color: on_surface_variant}

      - {name: div3, widget: Divider, style: {width: expand}}

      - name: code_heading
        widget: Text
        text: "Source"
        style: {text_style: title-medium, color: primary}

      - name: code_panels
        widget: Horizontal
        style: {spacing: 16, width: expand, height: 260}
        children:
          - name: yaml_source
            widget: CodeEditor
            value: "{{ view_source }}"
            style: {width: expand, height: expand, language: yaml, read_only: true}
          - name: python_source
            widget: CodeEditor
            value: "{{ viewmodel_source }}"
            style: {width: expand, height: expand, language: python, read_only: true}
