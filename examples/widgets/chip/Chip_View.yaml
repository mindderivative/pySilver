name: root
widget: ScrollView
style: {width: expand, height: expand}
children:
  - widget: Vertical
    style:
      background: surface
      padding: 32
      spacing: 20
      width: expand
      cross_alignment: stretch
    children:
      - name: title
        widget: Text
        text: "Chip"
        style: {text_style: headline-small, color: on_surface}

      - name: summary
        widget: Text
        text: "M3's 32dp chip, four configurations: assist, filter, input, and suggestion."
        style: {text_style: body-large, color: on_surface_variant}

      - {name: div1, widget: Divider, style: {width: expand}}

      - name: explanation
        widget: Text
        text: |
          32dp tall, 8dp corner radius, a 1dp outline. Only the filter variant
          carries selection state -- clicking it slides in an 18dp leading
          checkmark, which is what pySilver's generic `value:`/`checked`
          convention drives here, the same convention Checkbox and Radio use.

          Use cases, from the spec: chips help people enter information, make
          selections, filter content, or trigger actions -- they are best used
          to help people accomplish their current task faster and easier.
          Chips are not buttons: a chip typically represents an input, an
          attribute, or a filter rather than a direct, permanent action.
        style: {text_style: body-medium, color: on_surface_variant}

      - {name: div2, widget: Divider, style: {width: expand}}

      - name: live_heading
        widget: Text
        text: "Live example"
        style: {text_style: title-medium, color: primary}

      - name: live_demo
        widget: Horizontal
        style: {spacing: 12, width: expand}
        children:
          - {name: chip_assist, widget: Chip, text: "Directions", style: {variant: assist}}
          - name: chip_filter
            widget: Chip
            text: "Vegetarian"
            value: "{{ filter_on.get() }}"
            style: {variant: filter}
            handlers: {on_click: toggle_filter}
          - {name: chip_input, widget: Chip, text: "alex@example.com", style: {variant: input}}
          - {name: chip_suggestion, widget: Chip, text: "Nearby", style: {variant: suggestion}}

      - {name: div3, widget: Divider, style: {width: expand}}

      - name: code_heading
        widget: Text
        text: "Source"
        style: {text_style: title-medium, color: primary}

      - name: code_panels
        widget: Horizontal
        style: {spacing: 16, width: expand, height: 260}
        children:
          - name: yaml_source
            widget: CodeEditor
            value: "{{ view_source }}"
            style: {width: expand, height: expand, language: yaml, read_only: true}
          - name: python_source
            widget: CodeEditor
            value: "{{ viewmodel_source }}"
            style: {width: expand, height: expand, language: python, read_only: true}
