root:
  name: root
  widget: ScrollView
  style: {width: expand, height: expand}
  children:
    - widget: Vertical
      style:
        background: surface
        padding: 32
        spacing: 20
        width: expand
        cross_alignment: stretch
      children:
        - name: title
          widget: Text
          text: "Side Sheet"
          style: {text_style: headline-small, color: on_surface}

        - name: summary
          widget: Text
          text: "M3's side sheet: full-height supplementary content docked to a screen edge, without blocking the primary content."
          style: {text_style: body-large, color: on_surface_variant}

        - {name: div1, widget: Divider, style: {width: expand}}

        - name: explanation
          widget: Text
          text: |
            `surface_container_low`, 24dp start/end padding, a 400dp max
            width, 16dp corner radius. Which corners round depends on the
            edge it's docked to, taken from `placement:` -- a right-hand
            sheet rounds its left corners and vice versa. A standard side
            sheet has no scrim and isn't dismissed by clicking outside it --
            unlike a modal one, it's meant to stay open alongside the page,
            so M3's own anatomy names a close icon button as the way out,
            composed here as an ordinary child rather than a built-in part
            of the widget. There's no drag handle: that's a `BottomSheet`
            convention tied to its vertical slide, not something M3
            describes for a side sheet.

            Use cases, from the spec: side sheets display content without
            blocking access to the screen's primary content, such as an
            audio player at the side of a music app. They're often used at
            medium and expanded breakpoints, like tablet or desktop.
          style: {text_style: body-medium, color: on_surface_variant}

        - {name: div2, widget: Divider, style: {width: expand}}

        - name: live_heading
          widget: Text
          text: "Live example"
          style: {text_style: title-medium, color: primary}

        - name: live_demo
          widget: Horizontal
          style: {spacing: 16}
          children:
            - {name: trigger, widget: Button, text: "Now playing", style: {variant: outlined}, handlers: {on_click: open_sheet}}

        - {name: div3, widget: Divider, style: {width: expand}}

        - name: code_heading
          widget: Text
          text: "Source"
          style: {text_style: title-medium, color: primary}

        - name: code_panels
          widget: Horizontal
          style: {spacing: 16, width: expand, height: 260}
          children:
            - name: yaml_source
              widget: CodeEditor
              value: "{{ view_source }}"
              style: {width: expand, height: expand, language: yaml, read_only: true}
            - name: python_source
              widget: CodeEditor
              value: "{{ viewmodel_source }}"
              style: {width: expand, height: expand, language: python, read_only: true}

overlays:
  - name: sheet
    widget: SideSheet
    open: "{{ sheet_open.get() }}"
    style: {placement: right}
    handlers: {on_dismiss: close_sheet}
    children:
      - widget: Vertical
        style: {padding: 24, spacing: 12}
        children:
          - widget: Horizontal
            style: {main_alignment: space_between, cross_alignment: center}
            children:
              - {widget: Text, text: "Now playing", style: {text_style: title-medium, color: on_surface}}
              - {name: close_btn, widget: IconButton, icon: "close", style: {variant: standard}, handlers: {on_click: close_sheet}}
          - {widget: Text, text: "A track, docked at the side without covering the page.", style: {color: on_surface_variant}}
