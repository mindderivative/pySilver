name: root
widget: ScrollView
style: {width: expand, height: expand}
children:
  - widget: Vertical
    style:
      background: surface
      padding: 32
      spacing: 20
      width: expand
      cross_alignment: stretch
    children:
      - name: title
        widget: Text
        text: "Slider"
        style: {text_style: headline-small, color: on_surface}

      - name: summary
        widget: Text
        text: "M3's slider, Standard variant, every named size: style.size selects extra_small (default) through extra_large."
        style: {text_style: body-large, color: on_surface_variant}

      - {name: div1, widget: Divider, style: {width: expand}}

      - name: explanation
        widget: Text
        text: |
          Track height 16/24/40/56/96dp, handle height 44/44/52/68/108dp,
          track corner radius 8/8/12/16/28dp for extra_small/small/medium/
          large/extra_large -- COMPONENT_SLIDERS.md's own Measurements
          table. Handle width stays a constant 4dp at every size.
          `style: {min, max, step}` bound it -- unlike SpinBox, an unset
          min/max falls back to 0.0/1.0 rather than "unbounded", since a
          slider needs a real range to draw a track at all. Click or drag
          anywhere on the track to jump the handle there and keep
          dragging; Left/Right/Up/Down step by `style.step`; Home/End jump
          to the bounds.

          Use cases: a slider is the right control when a value is best
          understood by dragging within a bounded range -- volume,
          brightness, a percentage -- rather than typing or stepping one
          unit at a time the way `SpinBox` does. Larger sizes increase the
          target and give more visual emphasis; M3 reserves extra_large
          for a "hero moment" where the slider is the page's main control.
        style: {text_style: body-medium, color: on_surface_variant}

      - {name: div2, widget: Divider, style: {width: expand}}

      - name: live_heading
        widget: Text
        text: "Live example -- all five sizes"
        style: {text_style: title-medium, color: primary}

      - name: live_demo
        widget: Vertical
        style: {spacing: 20, width: expand, cross_alignment: stretch}
        children:
          - name: row_xs
            widget: Horizontal
            style: {spacing: 16, width: expand, cross_alignment: center}
            children:
              - {widget: Text, text: "extra_small", style: {width: 100, color: on_surface_variant}}
              - name: volume_xs
                widget: Slider
                value: "{{ volume_xs.get() }}"
                style: {width: expand, min: 0, max: 100, step: 5, size: extra_small}
                handlers: {on_change: change_volume_xs}
              - {widget: Text, text: "{{ volume_xs.get() }}", style: {color: on_surface_variant}}
          - name: row_s
            widget: Horizontal
            style: {spacing: 16, width: expand, cross_alignment: center}
            children:
              - {widget: Text, text: "small", style: {width: 100, color: on_surface_variant}}
              - name: volume_s
                widget: Slider
                value: "{{ volume_s.get() }}"
                style: {width: expand, min: 0, max: 100, step: 5, size: small}
                handlers: {on_change: change_volume_s}
              - {widget: Text, text: "{{ volume_s.get() }}", style: {color: on_surface_variant}}
          - name: row_m
            widget: Horizontal
            style: {spacing: 16, width: expand, cross_alignment: center}
            children:
              - {widget: Text, text: "medium", style: {width: 100, color: on_surface_variant}}
              - name: volume_m
                widget: Slider
                value: "{{ volume_m.get() }}"
                style: {width: expand, min: 0, max: 100, step: 5, size: medium}
                handlers: {on_change: change_volume_m}
              - {widget: Text, text: "{{ volume_m.get() }}", style: {color: on_surface_variant}}
          - name: row_l
            widget: Horizontal
            style: {spacing: 16, width: expand, cross_alignment: center}
            children:
              - {widget: Text, text: "large", style: {width: 100, color: on_surface_variant}}
              - name: volume_l
                widget: Slider
                value: "{{ volume_l.get() }}"
                style: {width: expand, min: 0, max: 100, step: 5, size: large}
                handlers: {on_change: change_volume_l}
              - {widget: Text, text: "{{ volume_l.get() }}", style: {color: on_surface_variant}}
          - name: row_xl
            widget: Horizontal
            style: {spacing: 16, width: expand, cross_alignment: center}
            children:
              - {widget: Text, text: "extra_large", style: {width: 100, color: on_surface_variant}}
              - name: volume_xl
                widget: Slider
                value: "{{ volume_xl.get() }}"
                style: {width: expand, min: 0, max: 100, step: 5, size: extra_large}
                handlers: {on_change: change_volume_xl}
              - {widget: Text, text: "{{ volume_xl.get() }}", style: {color: on_surface_variant}}

      - {name: div_shapes, widget: Divider, style: {width: expand}}

      - name: shapes_heading
        widget: Text
        text: "Handle shapes -- pySilver's own, not M3"
        style: {text_style: title-medium, color: primary}

      - name: shapes_explanation
        widget: Text
        text: |
          `style.handle_shape` also takes `square`/`hexagon` (the same
          regular-polygon primitive `Shape` uses -- no new engine work);
          `style.handle_image:` draws a decoded image instead, winning over
          `handle_shape` when both are set. A true star was asked for and
          dropped from this pass on purpose: `add_polygon` only draws
          regular polygons and cannot express one at all.
        style: {text_style: body-medium, color: on_surface_variant}

      - name: shapes_demo
        widget: Vertical
        style: {spacing: 20, width: expand, cross_alignment: stretch}
        children:
          - name: row_line
            widget: Horizontal
            style: {spacing: 16, width: expand, cross_alignment: center}
            children:
              - {widget: Text, text: "line (default)", style: {width: 140, color: on_surface_variant}}
              - name: handle_line
                widget: Slider
                value: "{{ shape_line.get() }}"
                style: {width: expand, min: 0, max: 100, step: 5}
                handlers: {on_change: change_shape_line}
          - name: row_circle
            widget: Horizontal
            style: {spacing: 16, width: expand, cross_alignment: center}
            children:
              - {widget: Text, text: "circle", style: {width: 140, color: on_surface_variant}}
              - name: handle_circle
                widget: Slider
                value: "{{ shape_circle.get() }}"
                style: {width: expand, min: 0, max: 100, step: 5, handle_shape: circle}
                handlers: {on_change: change_shape_circle}
          - name: row_square
            widget: Horizontal
            style: {spacing: 16, width: expand, cross_alignment: center}
            children:
              - {widget: Text, text: "square", style: {width: 140, color: on_surface_variant}}
              - name: handle_square
                widget: Slider
                value: "{{ shape_square.get() }}"
                style: {width: expand, min: 0, max: 100, step: 5, handle_shape: square}
                handlers: {on_change: change_shape_square}
          - name: row_hexagon
            widget: Horizontal
            style: {spacing: 16, width: expand, cross_alignment: center}
            children:
              - {widget: Text, text: "hexagon", style: {width: 140, color: on_surface_variant}}
              - name: handle_hexagon
                widget: Slider
                value: "{{ shape_hexagon.get() }}"
                style: {width: expand, min: 0, max: 100, step: 5, handle_shape: hexagon}
                handlers: {on_change: change_shape_hexagon}
          - name: row_image
            widget: Horizontal
            style: {spacing: 16, width: expand, cross_alignment: center}
            children:
              - {widget: Text, text: "handle_image:", style: {width: 140, color: on_surface_variant}}
              - name: handle_image_slider
                widget: Slider
                value: "{{ shape_image.get() }}"
                # `style.*` fields aren't `{{ }}`-bindable (unlike `path:`,
                # a WidgetSpec-level TEMPLATED_FIELD) -- a literal path,
                # relative to the repo root this demo is launched from
                # ("python examples/widgets/slider/app.py"), same
                # resolution convention `Image.path:` documents.
                style: {width: expand, min: 0, max: 100, step: 5, handle_image: "examples/gallery/assets/sample.png"}
                handlers: {on_change: change_shape_image}

      - {name: div3, widget: Divider, style: {width: expand}}

      - name: code_heading
        widget: Text
        text: "Source"
        style: {text_style: title-medium, color: primary}

      - name: code_panels
        widget: Horizontal
        style: {spacing: 16, width: expand, height: 260}
        children:
          - name: yaml_source
            widget: CodeEditor
            value: "{{ view_source }}"
            style: {width: expand, height: expand, language: yaml, read_only: true}
          - name: python_source
            widget: CodeEditor
            value: "{{ viewmodel_source }}"
            style: {width: expand, height: expand, language: python, read_only: true}
