name: root
widget: ScrollView
style: {width: expand, height: expand}
children:
  - widget: Vertical
    style:
      background: surface
      padding: 32
      spacing: 20
      width: expand
      cross_alignment: stretch
    children:
      - name: title
        widget: Text
        text: "Vertical"
        style: {text_style: headline-small, color: on_surface}

      - name: summary
        widget: Text
        text: "A flex container laying its children out vertically, with control over their spacing and cross-axis alignment."
        style: {text_style: body-large, color: on_surface_variant}

      - {name: div1, widget: Divider, style: {width: expand}}

      - name: explanation
        widget: Text
        text: |
          The same `Flex` algorithm `Horizontal` uses, with the main axis
          rotated to vertical: children lay out top to bottom first,
          then `style.cross_alignment` positions each one horizontally
          -- start, end, center, or stretch to the column's own width.
          `stretch` is what most pages in this whole set of demos use
          for their own outer Vertical, which is why headings, dividers,
          and code panels all read full width by default. Since this is
          a plain style property, the button below drives it by
          rebuilding the view in Python and calling
          `self.app.reload(...)`.

          Use cases: any vertical stack of content -- a form, a settings
          page, a list of cards -- where children of different widths
          need consistent horizontal alignment.
        style: {text_style: body-medium, color: on_surface_variant}

      - {name: div2, widget: Divider, style: {width: expand}}

      - name: live_heading
        widget: Text
        text: "Live example -- click to change cross_alignment"
        style: {text_style: title-medium, color: primary}

      - name: live_demo
        widget: Vertical
        style: {cross_alignment: start, spacing: 8, width: expand, background: surface_container_low, corner_radius: 8, padding: 12}
        children:
          - {widget: Container, style: {width: 160, height: 32, background: primary, corner_radius: 6}}
          - {widget: Container, style: {width: 100, height: 32, background: secondary, corner_radius: 6}}
          - {widget: Container, style: {width: 220, height: 32, background: tertiary, corner_radius: 6}}

      - widget: Text
        text: "cross_alignment: start"
        name: label
        style: {color: on_surface_variant}

      - name: controls
        widget: Horizontal
        style: {spacing: 8}
        children:
          - {widget: Button, text: "Cycle cross_alignment", style: {variant: outlined}, handlers: {on_click: cycle_alignment}}

      - {name: div3, widget: Divider, style: {width: expand}}

      - name: code_heading
        widget: Text
        text: "Source"
        style: {text_style: title-medium, color: primary}

      - name: code_panels
        widget: Horizontal
        style: {spacing: 16, width: expand, height: 260}
        children:
          - name: yaml_source
            widget: CodeEditor
            value: "{{ view_source }}"
            style: {width: expand, height: expand, language: yaml, read_only: true}
          - name: python_source
            widget: CodeEditor
            value: "{{ viewmodel_source }}"
            style: {width: expand, height: expand, language: python, read_only: true}
