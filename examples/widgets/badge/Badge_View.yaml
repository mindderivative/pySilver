name: root
widget: ScrollView
style: {width: expand, height: expand}
children:
  - widget: Vertical
    style:
      background: surface
      padding: 32
      spacing: 20
      width: expand
      cross_alignment: stretch
    children:
      - name: title
        widget: Text
        text: "Badge"
        style: {text_style: headline-small, color: on_surface}

      - name: summary
        widget: Text
        text: "M3's badge: a 6dp dot or a 16dp numbered pill, placed on the ending edge of an icon."
        style: {text_style: body-large, color: on_surface_variant}

      - {name: div1, widget: Divider, style: {width: expand}}

      - name: explanation
        widget: Text
        text: |
          A Badge is not a child of the icon it decorates -- it is a
          sibling, positioned over it with a `Stack`. `value:` carries
          the count, so it tracks a Signal; leaving `value:` unset
          (or empty) gives the 6dp dot form instead of the numbered pill.
          This demo hosts each badge on a minimal `IconButton` purely as
          the anchor a badge needs to sit on -- the badge itself is what
          this page is about.

          Use cases, from the spec: badges indicate a notification, item
          count, or other information relating to a navigation
          destination. There are two variants: small (dot) and large
          (numbered).
        style: {text_style: body-medium, color: on_surface_variant}

      - {name: div2, widget: Divider, style: {width: expand}}

      - name: live_heading
        widget: Text
        text: "Live example"
        style: {text_style: title-medium, color: primary}

      - name: live_demo
        widget: Horizontal
        style: {spacing: 32}
        children:
          - name: dot_host
            widget: Stack
            style: {width: 40, height: 40}
            children:
              - {widget: IconButton, icon: "notifications", style: {variant: standard}}
              - {name: dot, widget: Badge, style: {align_x: 1.0, align_y: 0.0}}
          - name: count_host
            widget: Stack
            style: {width: 40, height: 40}
            children:
              - {widget: IconButton, icon: "mail", style: {variant: standard}}
              - {name: count, widget: Badge, value: "{{ unread.get() }}", style: {align_x: 1.0, align_y: 0.0}}
          - {widget: Button, text: "+1 unread", style: {variant: outlined}, handlers: {on_click: increment}}

      - {name: div3, widget: Divider, style: {width: expand}}

      - name: code_heading
        widget: Text
        text: "Source"
        style: {text_style: title-medium, color: primary}

      - name: code_panels
        widget: Horizontal
        style: {spacing: 16, width: expand, height: 260}
        children:
          - name: yaml_source
            widget: CodeEditor
            value: "{{ view_source }}"
            style: {width: expand, height: expand, language: yaml, read_only: true}
          - name: python_source
            widget: CodeEditor
            value: "{{ viewmodel_source }}"
            style: {width: expand, height: expand, language: python, read_only: true}
