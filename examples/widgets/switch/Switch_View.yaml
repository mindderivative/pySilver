name: root
widget: ScrollView
style: {width: expand, height: expand}
children:
  - widget: Vertical
    style:
      background: surface
      padding: 32
      spacing: 20
      width: expand
      cross_alignment: stretch
    children:
      - name: title
        widget: Text
        text: "Switch"
        style: {text_style: headline-small, color: on_surface}

      - name: summary
        widget: Text
        text: "M3's 52x32dp switch: a binary on/off toggle that takes effect immediately."
        style: {text_style: body-large, color: on_surface_variant}

      - {name: div1, widget: Divider, style: {width: expand}}

      - name: explanation
        widget: Text
        text: |
          A 52x32dp track; the thumb is 16dp unselected and grows to 24dp
          selected, sliding and growing over 200ms with standard easing (M3's
          own stated timing for selection controls). The spec names two
          interactions -- "Touch: Tap, Drag" -- and pySilver supports both: a
          tap toggles it, and a real drag past the far edge of the track
          commits to whichever side it lands on.

          Use cases, from the spec: switches are best used to adjust settings
          and other standalone options that make a binary choice -- on and
          off, true and false. Prefer a switch over a checkbox when the choice
          takes effect right away, with no separate confirm step.
        style: {text_style: body-medium, color: on_surface_variant}

      - {name: div2, widget: Divider, style: {width: expand}}

      - name: live_heading
        widget: Text
        text: "Live example"
        style: {text_style: title-medium, color: primary}

      - name: live_demo
        widget: Horizontal
        style: {spacing: 8}
        children:
          - name: sw1
            widget: Switch
            value: "{{ on.get() }}"
            handlers: {on_click: toggle}
          - widget: Text
            text: "Wi-Fi is {{ 'on' if on.get() else 'off' }} -- click, or drag it past the far edge"
            style: {color: on_surface}

      - {name: div3, widget: Divider, style: {width: expand}}

      - name: code_heading
        widget: Text
        text: "Source"
        style: {text_style: title-medium, color: primary}

      - name: code_panels
        widget: Horizontal
        style: {spacing: 16, width: expand, height: 260}
        children:
          - name: yaml_source
            widget: CodeEditor
            value: "{{ view_source }}"
            style: {width: expand, height: expand, language: yaml, read_only: true}
          - name: python_source
            widget: CodeEditor
            value: "{{ viewmodel_source }}"
            style: {width: expand, height: expand, language: python, read_only: true}
