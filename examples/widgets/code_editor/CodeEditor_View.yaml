name: root
widget: ScrollView
style: {width: expand, height: expand}
children:
  - widget: Vertical
    style:
      background: surface
      padding: 32
      spacing: 20
      width: expand
      cross_alignment: stretch
    children:
      - name: title
        widget: Text
        text: "Code Editor"
        style: {text_style: headline-small, color: on_surface}

      - name: summary
        widget: Text
        text: "Not an M3 component: a syntax-highlighted, line-numbered multi-line editor -- try editing the sample below."
        style: {text_style: body-large, color: on_surface_variant}

      - {name: div1, widget: Divider, style: {width: expand}}

      - name: explanation
        widget: Text
        text: |
          Built alongside `TextField`, not on top of it: `TextField`'s
          own layout and paint are saturated with M3-specific chrome
          this widget has none of (a floating label, an indicator stroke
          that thickens on focus). Both share the same underlying
          editing model instead -- grapheme-aware caret motion, undo/
          redo, selection ranges -- with none of the M3 baggage. Lines
          never wrap: `max_width=None` always, so line numbers stay 1:1
          with the source's own lines and a long line scrolls sideways
          instead. Syntax highlighting is optional, via Pygments, not a
          hard dependency. Every read-only code panel elsewhere in this
          set of demos, including the two below, is this exact widget
          with `style.read_only: true` set on it.
        style: {text_style: body-medium, color: on_surface_variant}

      - {name: div2, widget: Divider, style: {width: expand}}

      - name: live_heading
        widget: Text
        text: "Live example -- editable, try typing"
        style: {text_style: title-medium, color: primary}

      - name: live_demo
        widget: CodeEditor
        value: |
          def fib(n: int) -> int:
              a, b = 0, 1
              for _ in range(n):
                  a, b = b, a + b
              return a
        style: {width: expand, height: 160, language: python}

      - {name: div3, widget: Divider, style: {width: expand}}

      - name: code_heading
        widget: Text
        text: "Source"
        style: {text_style: title-medium, color: primary}

      - name: code_panels
        widget: Horizontal
        style: {spacing: 16, width: expand, height: 260}
        children:
          - name: yaml_source
            widget: CodeEditor
            value: "{{ view_source }}"
            style: {width: expand, height: expand, language: yaml, read_only: true}
          - name: python_source
            widget: CodeEditor
            value: "{{ viewmodel_source }}"
            style: {width: expand, height: expand, language: python, read_only: true}
