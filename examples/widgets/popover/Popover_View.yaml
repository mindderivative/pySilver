root:
  name: root
  widget: ScrollView
  style: {width: expand, height: expand}
  children:
    - widget: Vertical
      style:
        background: surface
        padding: 32
        spacing: 20
        width: expand
        cross_alignment: stretch
      children:
        - name: title
          widget: Text
          text: "Popover"
          style: {text_style: headline-small, color: on_surface}

        - name: summary
          widget: Text
          text: "M3 has no Popover page -- this is its persistent rich tooltip: appears on click, stays until you interact elsewhere."
          style: {text_style: body-large, color: on_surface_variant}

        - {name: div1, widget: Divider, style: {width: expand}}

        - name: explanation
          widget: Text
          text: |
            The spec's own words: "Persistent rich tooltips appear when...
            the parent element is clicked" and "remain active even when
            leaving the target region. They only disappear once a person
            interacts with another UI element. Hovering doesn't trigger
            the tooltip." A subhead (`text:`) and supporting text
            (`supporting_text:`) both `on_surface_variant`, 12dp corners,
            `surface_container_high`, elevation level 2 -- the same level
            `Menu` sits at. Width is shrink-to-fit up to a 320dp maximum,
            not fill-to-minimum the way `Dialog`/`Menu` are, since a
            one-line popover should stay exactly that wide.

            Use cases: a richer alternative to a plain tooltip when the
            explanation needs more than one short line, or an optional
            action -- without the full interruption of a Dialog.
          style: {text_style: body-medium, color: on_surface_variant}

        - {name: div2, widget: Divider, style: {width: expand}}

        - name: live_heading
          widget: Text
          text: "Live example"
          style: {text_style: title-medium, color: primary}

        - name: live_demo
          widget: Horizontal
          style: {spacing: 16}
          children:
            - name: trigger
              widget: IconButton
              icon: "info"
              style: {variant: standard}
              handlers: {on_click: open_popover}

        - {name: div3, widget: Divider, style: {width: expand}}

        - name: code_heading
          widget: Text
          text: "Source"
          style: {text_style: title-medium, color: primary}

        - name: code_panels
          widget: Horizontal
          style: {spacing: 16, width: expand, height: 260}
          children:
            - name: yaml_source
              widget: CodeEditor
              value: "{{ view_source }}"
              style: {width: expand, height: expand, language: yaml, read_only: true}
            - name: python_source
              widget: CodeEditor
              value: "{{ viewmodel_source }}"
              style: {width: expand, height: expand, language: python, read_only: true}

overlays:
  - name: pop
    widget: Popover
    open: "{{ pop_open.get() }}"
    text: "Sync status"
    supporting_text: "Last synced 2 minutes ago. Click elsewhere to dismiss."
    style: {anchor: trigger}
    handlers: {on_dismiss: close_popover}
