name: root
widget: ScrollView
style: {width: expand, height: expand}
children:
  - widget: Vertical
    style:
      background: surface
      padding: 32
      spacing: 20
      width: expand
      cross_alignment: stretch
    children:
      - name: title
        widget: Text
        text: "Nav Item"
        style: {text_style: headline-small, color: on_surface}

      - name: summary
        widget: Text
        text: "One destination in a navigation rail or drawer: an icon, a label, and a 56x32dp active indicator."
        style: {text_style: body-large, color: on_surface_variant}

      - {name: div1, widget: Divider, style: {width: expand}}

      - name: explanation
        widget: Text
        text: |
          `icon:` is the icon name, `label:` the destination's label. The
          icon's FILL axis goes to 1 when selected -- M3's own mechanism
          for expressing selection, rather than swapping to a visually
          different icon. A NavItem only makes sense inside a
          NavigationRail, so this demo hosts three of them in a minimal
          rail; NavItem's own anatomy is what this page focuses on, not
          the rail around it (which has its own demo).
        style: {text_style: body-medium, color: on_surface_variant}

      - {name: div2, widget: Divider, style: {width: expand}}

      - name: live_heading
        widget: Text
        text: "Live example"
        style: {text_style: title-medium, color: primary}

      - name: live_demo
        widget: Horizontal
        style: {spacing: 16}
        children:
          - name: rail
            widget: NavigationRail
            value: "{{ selected.get() }}"
            style: {height: 200}
            children:
              - {name: home, widget: NavItem, icon: "home", label: "Home", handlers: {on_click: select}}
              - {name: search, widget: NavItem, icon: "search", label: "Search", handlers: {on_click: select}}
              - {name: settings, widget: NavItem, icon: "settings", label: "Settings", handlers: {on_click: select}}
          - widget: Text
            text: "Selected: {{ selected.get() }}"
            style: {color: on_surface_variant}

      - {name: div3, widget: Divider, style: {width: expand}}

      - name: code_heading
        widget: Text
        text: "Source"
        style: {text_style: title-medium, color: primary}

      - name: code_panels
        widget: Horizontal
        style: {spacing: 16, width: expand, height: 260}
        children:
          - name: yaml_source
            widget: CodeEditor
            value: "{{ view_source }}"
            style: {width: expand, height: expand, language: yaml, read_only: true}
          - name: python_source
            widget: CodeEditor
            value: "{{ viewmodel_source }}"
            style: {width: expand, height: expand, language: python, read_only: true}
