name: root
widget: ScrollView
style: {width: expand, height: expand}
children:
  - widget: Vertical
    style:
      background: surface
      padding: 32
      spacing: 20
      width: expand
      cross_alignment: stretch
    children:
      - name: title
        widget: Text
        text: "Image"
        style: {text_style: headline-small, color: on_surface}

      - name: summary
        widget: Text
        text: "Not an M3 component: a leaf widget that decodes a path once, caches it, and draws it."
        style: {text_style: body-large, color: on_surface_variant}

      - {name: div1, widget: Divider, style: {width: expand}}

      - name: explanation
        widget: Text
        text: |
          With no explicit `width`/`height`, Image reports the decoded
          image's own pixel dimensions as its logical size (one image px,
          one logical px) -- an axis the view *did* size still wins. A
          missing file or a decode failure is caught once, logged to
          stderr, and cached as "nothing to draw" rather than raised, so
          one bad asset reference does not crash the whole frame's paint.

          Use cases: any bitmap content a view needs to show -- a photo,
          an avatar, a logo -- decoded once and reused from the shared
          atlas on every repaint rather than re-decoded per frame.
        style: {text_style: body-medium, color: on_surface_variant}

      - {name: div2, widget: Divider, style: {width: expand}}

      - name: live_heading
        widget: Text
        text: "Live example"
        style: {text_style: title-medium, color: primary}

      - name: live_demo
        widget: Horizontal
        children:
          - name: sample
            widget: Image
            path: "{{ image_path }}"
            style: {width: 260, height: 160, corner_radius: 12}

      - {name: div3, widget: Divider, style: {width: expand}}

      - name: code_heading
        widget: Text
        text: "Source"
        style: {text_style: title-medium, color: primary}

      - name: code_panels
        widget: Horizontal
        style: {spacing: 16, width: expand, height: 260}
        children:
          - name: yaml_source
            widget: CodeEditor
            value: "{{ view_source }}"
            style: {width: expand, height: expand, language: yaml, read_only: true}
          - name: python_source
            widget: CodeEditor
            value: "{{ viewmodel_source }}"
            style: {width: expand, height: expand, language: python, read_only: true}
