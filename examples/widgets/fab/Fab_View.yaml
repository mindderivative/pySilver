name: root
widget: ScrollView
style: {width: expand, height: expand}
children:
  - widget: Vertical
    style:
      background: surface
      padding: 32
      spacing: 20
      width: expand
      cross_alignment: stretch
    children:
      - name: title
        widget: Text
        text: "Fab"
        style: {text_style: headline-small, color: on_surface}

      - name: summary
        widget: Text
        text: "M3's floating action button: the most important action on a screen, in five sizes."
        style: {text_style: body-large, color: on_surface_variant}

      - {name: div1, widget: Divider, style: {width: expand}}

      - name: explanation
        widget: Text
        text: |
          Small (40dp, 12dp radius), standard (56dp, 16dp radius), medium
          (80dp, 20dp radius), large (96dp, 28dp radius), and extended (56dp
          tall like standard, but a dynamic width fitting an icon and a
          `label:` label side by side). Defaults to
          `primary_container` on `on_primary_container`. M3 rests a FAB at
          elevation level 3, alongside modal dialogs -- the highest resting
          level any component uses.

          Use cases, from the spec: use a FAB for the most important action on
          a screen; it appears in front of all other content. It can be
          aligned left, centre, or right, and positioned above a navigation
          bar or nested within it.
        style: {text_style: body-medium, color: on_surface_variant}

      - {name: div2, widget: Divider, style: {width: expand}}

      - name: live_heading
        widget: Text
        text: "Live example"
        style: {text_style: title-medium, color: primary}

      - name: live_demo
        widget: Horizontal
        style: {spacing: 16, cross_alignment: end}
        children:
          - name: fab_small
            widget: Fab
            icon: "add"
            style: {variant: small}
            handlers: {on_click: press}
          - name: fab_standard
            widget: Fab
            icon: "add"
            style: {variant: standard}
            handlers: {on_click: press}
          - name: fab_medium
            widget: Fab
            icon: "add"
            style: {variant: medium}
            handlers: {on_click: press}
          - name: fab_large
            widget: Fab
            icon: "add"
            style: {variant: large}
            handlers: {on_click: press}
          - name: fab_extended
            widget: Fab
            icon: "add"
            label: "Compose"
            style: {variant: extended}
            handlers: {on_click: press}

      - name: readout
        widget: Text
        text: "Clicked {{ clicks.get() }} times"
        style: {color: on_surface_variant}

      - {name: div3, widget: Divider, style: {width: expand}}

      - name: code_heading
        widget: Text
        text: "Source"
        style: {text_style: title-medium, color: primary}

      - name: code_panels
        widget: Horizontal
        style: {spacing: 16, width: expand, height: 260}
        children:
          - name: yaml_source
            widget: CodeEditor
            value: "{{ view_source }}"
            style: {width: expand, height: expand, language: yaml, read_only: true}
          - name: python_source
            widget: CodeEditor
            value: "{{ viewmodel_source }}"
            style: {width: expand, height: expand, language: python, read_only: true}
