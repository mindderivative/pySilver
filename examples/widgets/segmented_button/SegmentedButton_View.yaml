name: root
widget: ScrollView
style: {width: expand, height: expand}
children:
  - widget: Vertical
    style:
      background: surface
      padding: 32
      spacing: 20
      width: expand
      cross_alignment: stretch
    children:
      - name: title
        widget: Text
        text: "Segmented Button"
        style: {text_style: headline-small, color: on_surface}

      - name: summary
        widget: Text
        text: "M3's segmented button: 40dp segments for selecting options, switching views, or sorting -- single- or multi-select."
        style: {text_style: body-large, color: on_surface_variant}

      - {name: div1, widget: Divider, style: {width: expand}}

      - name: explanation
        widget: Text
        text: |
          Selected segments show a leading 18dp checkmark that slides in,
          growing the segment's own width -- the container's height stays
          a fixed 40dp regardless. `style.multi_select` (default off)
          switches `value:` from naming one selected child to a
          comma-separated set, letting more than one segment stay
          selected at once.

          Use cases, from the spec: segmented buttons help people select
          options, switch views, or sort elements. There are two variants
          -- single-select and multi-select -- both shown below.
        style: {text_style: body-medium, color: on_surface_variant}

      - {name: div2, widget: Divider, style: {width: expand}}

      - name: live_heading
        widget: Text
        text: "Live example"
        style: {text_style: title-medium, color: primary}

      - name: live_demo
        widget: Vertical
        style: {spacing: 16, width: expand}
        children:
          - {widget: Text, text: "Single-select", style: {color: on_surface_variant}}
          - name: single
            widget: SegmentedButton
            value: "{{ view.get() }}"
            style: {width: expand}
            children:
              - {name: day, widget: Segment, text: "Day", handlers: {on_click: select_view}}
              - {name: week, widget: Segment, text: "Week", handlers: {on_click: select_view}}
              - {name: month, widget: Segment, text: "Month", handlers: {on_click: select_view}}
          - {widget: Text, text: "Multi-select", style: {color: on_surface_variant}}
          - name: multi
            widget: SegmentedButton
            value: "{{ days.get() }}"
            style: {width: expand, multi_select: true}
            children:
              - {name: mon, widget: Segment, text: "Mon", handlers: {on_click: toggle_day}}
              - {name: tue, widget: Segment, text: "Tue", handlers: {on_click: toggle_day}}
              - {name: wed, widget: Segment, text: "Wed", handlers: {on_click: toggle_day}}
              - {name: thu, widget: Segment, text: "Thu", handlers: {on_click: toggle_day}}
              - {name: fri, widget: Segment, text: "Fri", handlers: {on_click: toggle_day}}

      - {name: div3, widget: Divider, style: {width: expand}}

      - name: code_heading
        widget: Text
        text: "Source"
        style: {text_style: title-medium, color: primary}

      - name: code_panels
        widget: Horizontal
        style: {spacing: 16, width: expand, height: 260}
        children:
          - name: yaml_source
            widget: CodeEditor
            value: "{{ view_source }}"
            style: {width: expand, height: expand, language: yaml, read_only: true}
          - name: python_source
            widget: CodeEditor
            value: "{{ viewmodel_source }}"
            style: {width: expand, height: expand, language: python, read_only: true}
