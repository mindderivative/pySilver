name: root
widget: ScrollView
style: {width: expand, height: expand}
children:
  - widget: Vertical
    style:
      background: surface
      padding: 32
      spacing: 20
      width: expand
      cross_alignment: stretch
    children:
      - name: title
        widget: Text
        text: "Terminal"
        style: {text_style: headline-small, color: on_surface}

      - name: summary
        widget: Text
        text: "Not an M3 component: a real shell, spawned and parsed internally -- try typing into it."
        style: {text_style: body-large, color: on_surface_variant}

      - {name: div1, widget: Divider, style: {width: expand}}

      - name: explanation
        widget: Text
        text: |
          A view says `widget: Terminal, style: {shell: "/bin/bash"}` and
          it works, with no per-application PTY or VT-parsing
          boilerplate. Spawning a real pseudo-terminal is OS-specific
          process management; interpreting its byte stream is the VT/
          ANSI state machine every real terminal emulator implements
          identically -- neither is this widget's own concern to
          reinvent. `pexpect` gives POSIX PTY spawning, `bittty` gives the
          state machine; what pySilver actually builds is the third
          layer, rendering whatever cell grid `bittty`'s video memory says
          is currently true and turning keystrokes into the bytes a
          shell expects. Both are optional extras
          (`pysilver[terminal]`), never hard dependencies. Only POSIX is
          implemented and verified in this pass.

          Use cases: an embedded shell inside a larger tool -- a build
          console, a REPL, a debugging surface -- without shelling out
          to an external terminal emulator.
        style: {text_style: body-medium, color: on_surface_variant}

      - {name: div2, widget: Divider, style: {width: expand}}

      - name: live_heading
        widget: Text
        text: "Live example -- click in and type"
        style: {text_style: title-medium, color: primary}

      - name: live_demo
        widget: Terminal
        style: {height: 220, width: expand}

      - {name: div3, widget: Divider, style: {width: expand}}

      - name: code_heading
        widget: Text
        text: "Source"
        style: {text_style: title-medium, color: primary}

      - name: code_panels
        widget: Horizontal
        style: {spacing: 16, width: expand, height: 260}
        children:
          - name: yaml_source
            widget: CodeEditor
            value: "{{ view_source }}"
            style: {width: expand, height: expand, language: yaml, read_only: true}
          - name: python_source
            widget: CodeEditor
            value: "{{ viewmodel_source }}"
            style: {width: expand, height: expand, language: python, read_only: true}
