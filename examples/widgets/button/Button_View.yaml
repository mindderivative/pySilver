name: root
widget: ScrollView
style: {width: expand, height: expand}
children:
  - widget: Vertical
    style:
      background: surface
      padding: 32
      spacing: 20
      width: expand
      cross_alignment: stretch
    children:
      - name: title
        widget: Text
        text: "Button"
        style: {text_style: headline-small, color: on_surface}

      - name: summary
        widget: Text
        text: "M3's Common Button: one component, five configurations, all sized to their label with a 64dp floor."
        style: {text_style: body-large, color: on_surface_variant}

      - {name: div1, widget: Divider, style: {width: expand}}

      - name: explanation
        widget: Text
        text: |
          M3 describes filled, filled tonal, outlined, elevated, and text as one
          component in five configurations, so pySilver models them as one
          widget with a `variant`, not five widget kinds. Every variant is
          40dp tall with a 64dp minimum width, 24dp horizontal / 10dp vertical
          padding, and a label-large type role (14sp, medium weight). Only
          `elevated` rests above the surface; the other four sit at elevation 0.

          Use cases, from the spec's own guidance: "Use visually-prominent
          filled buttons for the most important actions." Buttons are typically
          placed in dialogs, modal windows, forms, cards, and toolbars, and can
          sit inside a button group. The spec also warns against overusing
          them -- "Too many buttons on a screen can disrupt the visual
          hierarchy" -- suggesting a navigation rail for additional actions
          instead of piling on more buttons.
        style: {text_style: body-medium, color: on_surface_variant}

      - {name: div2, widget: Divider, style: {width: expand}}

      - name: live_heading
        widget: Text
        text: "Live example"
        style: {text_style: title-medium, color: primary}

      - name: live_demo
        widget: Horizontal
        style: {spacing: 12, width: expand}
        children:
          - name: btn_filled
            widget: Button
            text: "Filled"
            style: {variant: filled}
            handlers: {on_click: press}
          - name: btn_tonal
            widget: Button
            text: "Tonal"
            style: {variant: filled_tonal}
            handlers: {on_click: press}
          - name: btn_outlined
            widget: Button
            text: "Outlined"
            style: {variant: outlined}
            handlers: {on_click: press}
          - name: btn_elevated
            widget: Button
            text: "Elevated"
            style: {variant: elevated}
            handlers: {on_click: press}
          - name: btn_text
            widget: Button
            text: "Text"
            style: {variant: text}
            handlers: {on_click: press}

      - name: readout
        widget: Text
        text: "Clicked {{ clicks.get() }} times"
        style: {color: on_surface_variant}

      - {name: div3, widget: Divider, style: {width: expand}}

      - name: code_heading
        widget: Text
        text: "Source"
        style: {text_style: title-medium, color: primary}

      - name: code_panels
        widget: Horizontal
        style: {spacing: 16, width: expand, height: 260}
        children:
          - name: yaml_source
            widget: CodeEditor
            value: "{{ view_source }}"
            style: {width: expand, height: expand, language: yaml, read_only: true}
          - name: python_source
            widget: CodeEditor
            value: "{{ viewmodel_source }}"
            style: {width: expand, height: expand, language: python, read_only: true}
