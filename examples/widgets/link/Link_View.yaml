name: root
widget: ScrollView
style: {width: expand, height: expand}
children:
  - widget: Vertical
    style:
      background: surface
      padding: 32
      spacing: 20
      width: expand
      cross_alignment: stretch
    children:
      - name: title
        widget: Text
        text: "Link"
        style: {text_style: headline-small, color: on_surface}

      - name: summary
        widget: Text
        text: "M3's hyperlinked text: always underlined, meant to sit inline with body text."
        style: {text_style: body-large, color: on_surface_variant}

      - {name: div1, widget: Divider, style: {width: expand}}

      - name: explanation
        widget: Text
        text: |
          Not a component with its own catalogue page: the source is the
          typography guidance's "Applying type" -- "For hyperlinked text
          appearing on top of a surface color, use primary. However, tertiary
          can be used to make links less prominent" -- and, separately,
          "Hyperlinked text must also be underlined". The Buttons page draws
          the contrast explicitly: "Don't underline the text button. Use
          hyperlinked body text instead to emphasize links." That is a Link's
          whole anatomy: no container and no state layer, unlike a text
          Button at rest.

          Use cases: reach for a Link, not a text Button, when the destination
          is a reference inside a sentence rather than a standalone action --
          the underline is what tells a reader "this is a link", the way it
          would in any document.
        style: {text_style: body-medium, color: on_surface_variant}

      - {name: div2, widget: Divider, style: {width: expand}}

      - name: live_heading
        widget: Text
        text: "Live example"
        style: {text_style: title-medium, color: primary}

      - name: live_demo
        widget: Vertical
        style: {spacing: 8}
        children:
          - name: sentence
            widget: Horizontal
            children:
              - {widget: Text, text: "Read the ", style: {color: on_surface}}
              - {name: link_primary, widget: Link, text: "M3 component index", style: {}}
              - {widget: Text, text: " for the full catalogue.", style: {color: on_surface}}
          - name: sentence2
            widget: Horizontal
            children:
              - {widget: Text, text: "A quieter, ", style: {color: on_surface}}
              - {name: link_tertiary, widget: Link, text: "tertiary-coloured", style: {variant: tertiary}}
              - {widget: Text, text: " link reads as less prominent.", style: {color: on_surface}}

      - {name: div3, widget: Divider, style: {width: expand}}

      - name: code_heading
        widget: Text
        text: "Source"
        style: {text_style: title-medium, color: primary}

      - name: code_panels
        widget: Horizontal
        style: {spacing: 16, width: expand, height: 260}
        children:
          - name: yaml_source
            widget: CodeEditor
            value: "{{ view_source }}"
            style: {width: expand, height: expand, language: yaml, read_only: true}
          - name: python_source
            widget: CodeEditor
            value: "{{ viewmodel_source }}"
            style: {width: expand, height: expand, language: python, read_only: true}
