name: root
widget: ScrollView
style: {width: expand, height: expand}
children:
  - widget: Vertical
    style:
      background: surface
      padding: 32
      spacing: 20
      width: expand
      cross_alignment: stretch
    children:
      - name: title
        widget: Text
        text: "Node"
        style: {text_style: headline-small, color: on_surface}

      - name: summary
        widget: Text
        text: "Not M3: one draggable node inside a NodeGraph -- a title bar, named ports, and one child."
        style: {text_style: body-large, color: on_surface_variant}

      - {name: div1, widget: Divider, style: {width: expand}}

      - name: explanation
        widget: Text
        text: |
          `text:` is the title. `style.x`/`y` is only the *initial*
          world position -- dragging the title bar moves the node and
          fires `on_change` with its new `"x,y"` position once the drag
          ends; the arrow keys nudge it the same way and fire
          immediately, since there's no separate release event for a
          key. `inputs`/`outputs` name this node's ports, drawn evenly
          spaced down its left/right edge respectively; the graph's own
          `edges:` list connects one node's named output to another's
          named input. A Node only makes sense inside a `NodeGraph`, so
          this demo hosts three, connected -- Node's own anatomy is the
          focus here, not the graph (which has no separate demo of its
          own, since it has no M3 grounding to cite beyond what's here).
        style: {text_style: body-medium, color: on_surface_variant}

      - {name: div2, widget: Divider, style: {width: expand}}

      - name: live_heading
        widget: Text
        text: "Live example -- drag a title bar to move it"
        style: {text_style: title-medium, color: primary}

      - name: live_demo
        widget: NodeGraph
        style: {height: 220, width: expand}
        edges:
          - {source: "node_in.out", target: "node_proc.in"}
          - {source: "node_proc.out", target: "node_out.in"}
        children:
          - {name: node_in, widget: Node, text: "Input", outputs: "out", style: {x: 20, y: 70}}
          - {name: node_proc, widget: Node, text: "Process", inputs: "in", outputs: "out", style: {x: 220, y: 20}}
          - {name: node_out, widget: Node, text: "Output", inputs: "in", style: {x: 420, y: 70}}

      - {name: div3, widget: Divider, style: {width: expand}}

      - name: code_heading
        widget: Text
        text: "Source"
        style: {text_style: title-medium, color: primary}

      - name: code_panels
        widget: Horizontal
        style: {spacing: 16, width: expand, height: 260}
        children:
          - name: yaml_source
            widget: CodeEditor
            value: "{{ view_source }}"
            style: {width: expand, height: expand, language: yaml, read_only: true}
          - name: python_source
            widget: CodeEditor
            value: "{{ viewmodel_source }}"
            style: {width: expand, height: expand, language: python, read_only: true}
