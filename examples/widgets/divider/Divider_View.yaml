name: root
widget: ScrollView
style: {width: expand, height: expand}
children:
  - widget: Vertical
    style:
      background: surface
      padding: 32
      spacing: 20
      width: expand
      cross_alignment: stretch
    children:
      - name: title
        widget: Text
        text: "Divider"
        style: {text_style: headline-small, color: on_surface}

      - name: summary
        widget: Text
        text: "M3's divider: a 1dp line of `outline_variant`, full-bleed or inset."
        style: {text_style: body-large, color: on_surface_variant}

      - {name: div1, widget: Divider, style: {width: expand}}

      - name: explanation
        widget: Text
        text: |
          1dp thick, coloured `outline_variant` unless `background:` overrides
          it. The `inset` variant shifts its start by `style.inset` (a leading
          gap, so it does not touch the edge it would otherwise run to).

          Use cases, from the spec: dividers are one way to visually group
          components and create hierarchy, and can also imply nested
          parent/child relationships. A full-width divider (this page's own
          section rules, above and below) separates unrelated groups; an
          inset divider (indented to align with, say, an icon or avatar) is
          the better choice when items in a list share a visual anchor, like
          messages in an inbox versus songs in a playlist.
        style: {text_style: body-medium, color: on_surface_variant}

      - {name: div2, widget: Divider, style: {width: expand}}

      - name: live_heading
        widget: Text
        text: "Live example"
        style: {text_style: title-medium, color: primary}

      - name: live_demo
        widget: Vertical
        style: {spacing: 12, width: expand}
        children:
          - {widget: Text, text: "Full-bleed:", style: {color: on_surface_variant}}
          - {name: full_bleed, widget: Divider, style: {width: expand}}
          - {widget: Text, text: "Inset (56dp, aligned as if under a leading icon):", style: {color: on_surface_variant}}
          - {name: inset, widget: Divider, style: {width: expand, variant: inset, inset: 56}}

      - {name: div3, widget: Divider, style: {width: expand}}

      - name: code_heading
        widget: Text
        text: "Source"
        style: {text_style: title-medium, color: primary}

      - name: code_panels
        widget: Horizontal
        style: {spacing: 16, width: expand, height: 260}
        children:
          - name: yaml_source
            widget: CodeEditor
            value: "{{ view_source }}"
            style: {width: expand, height: expand, language: yaml, read_only: true}
          - name: python_source
            widget: CodeEditor
            value: "{{ viewmodel_source }}"
            style: {width: expand, height: expand, language: python, read_only: true}
