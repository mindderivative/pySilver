name: root
widget: ScrollView
style: {width: expand, height: expand}
children:
  - widget: Vertical
    style:
      background: surface
      padding: 32
      spacing: 20
      width: expand
      cross_alignment: stretch
    children:
      - name: title
        widget: Text
        text: "Dock Split"
        style: {text_style: headline-small, color: on_surface}

      - name: summary
        widget: Text
        text: "Not an M3 component: exactly two children separated by a draggable divider, the resizable half of an IDE-style layout."
        style: {text_style: body-large, color: on_surface_variant}

      - {name: div1, widget: Divider, style: {width: expand}}

      - name: explanation
        widget: Text
        text: |
          Checked directly against M3, which has nothing for this.
          Either child can itself be a `DockGroup` or a further
          `DockSplit`, which is how a full IDE layout nests. `value:` is
          the first child's own share of the space, 0 to 1; dragging the
          divider updates it and fires `on_change`, the same value/
          on_change convention every other value-bearing widget in this
          catalogue uses. This page is genuinely draggable, not a static
          picture.

          Use cases: dividing a workspace into resizable regions -- a
          file tree beside an editor, a preview panel above a log --
          where a person decides the split, not a fixed proportion.
        style: {text_style: body-medium, color: on_surface_variant}

      - {name: div2, widget: Divider, style: {width: expand}}

      - name: live_heading
        widget: Text
        text: "Live example -- drag the divider to resize"
        style: {text_style: title-medium, color: primary}

      - name: live_demo
        widget: DockSplit
        value: "{{ ratio.get() }}"
        style: {height: 200, width: expand}
        handlers: {on_change: change_ratio}
        children:
          - widget: DockGroup
            style: {width: expand}
            children:
              - name: left_panel
                widget: DockPanel
                text: "Left"
                children:
                  - {widget: Text, text: "First child's share", style: {color: on_surface_variant}}
          - widget: DockGroup
            style: {width: expand}
            children:
              - name: right_panel
                widget: DockPanel
                text: "Right"
                children:
                  - {widget: Text, text: "Second child's share", style: {color: on_surface_variant}}

      - widget: Text
        text: "First child's share: {{ ratio.get() }}"
        style: {color: on_surface_variant}

      - {name: div3, widget: Divider, style: {width: expand}}

      - name: code_heading
        widget: Text
        text: "Source"
        style: {text_style: title-medium, color: primary}

      - name: code_panels
        widget: Horizontal
        style: {spacing: 16, width: expand, height: 260}
        children:
          - name: yaml_source
            widget: CodeEditor
            value: "{{ view_source }}"
            style: {width: expand, height: expand, language: yaml, read_only: true}
          - name: python_source
            widget: CodeEditor
            value: "{{ viewmodel_source }}"
            style: {width: expand, height: expand, language: python, read_only: true}
