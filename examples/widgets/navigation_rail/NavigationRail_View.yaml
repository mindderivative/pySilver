name: root
widget: ScrollView
style: {width: expand, height: expand}
children:
  - widget: Vertical
    style:
      background: surface
      padding: 32
      spacing: 20
      width: expand
      cross_alignment: stretch
    children:
      - name: title
        widget: Text
        text: "Navigation Rail"
        style: {text_style: headline-small, color: on_surface}

      - name: summary
        widget: Text
        text: "M3's navigation rail: one widget, two states -- collapsed (80dp, icon-only) and expanded (240-360dp, with labels) -- that transform into each other."
        style: {text_style: body-large, color: on_surface_variant}

      - {name: div1, widget: Divider, style: {width: expand}}

      - name: explanation
        widget: Text
        text: |
          M3 Expressive folded the old, separate "Navigation Drawer" into
          this widget's own expanded state: "the expanded nav rail is
          meant to replace the [modal] navigation drawer" entirely.
          `icon:` on each `NavItem` is the icon glyph, `label:`
          the destination's label. `collapsed:` (default false, so an unset rail starts
          expanded) switches between the two -- animated, not instant --
          without changing which item is selected.

          Use cases, from the spec: the navigation rail can display
          navigation items, a menu, and a FAB in a vertical orientation.
          "Collapsed and expanded navigation rails... can easily transform
          into each other when the menu button is selected" -- quoted
          directly.
        style: {text_style: body-medium, color: on_surface_variant}

      - {name: div2, widget: Divider, style: {width: expand}}

      - name: live_heading
        widget: Text
        text: "Live example"
        style: {text_style: title-medium, color: primary}

      - name: live_demo
        widget: Horizontal
        style: {spacing: 16}
        children:
          - name: rail
            widget: NavigationRail
            value: "{{ selected.get() }}"
            collapsed: "{{ collapsed.get() }}"
            style: {height: 260}
            children:
              - {name: home, widget: NavItem, icon: "home", label: "Home", handlers: {on_click: select}}
              - {name: search, widget: NavItem, icon: "search", label: "Search", handlers: {on_click: select}}
              - {name: settings, widget: NavItem, icon: "settings", label: "Settings", handlers: {on_click: select}}
          - widget: Vertical
            style: {spacing: 8}
            children:
              - {widget: Button, text: "Toggle collapsed", style: {variant: outlined}, handlers: {on_click: toggle_collapsed}}
              - widget: Text
                text: "Selected: {{ selected.get() }}"
                style: {color: on_surface_variant}

      - {name: div3, widget: Divider, style: {width: expand}}

      - name: code_heading
        widget: Text
        text: "Source"
        style: {text_style: title-medium, color: primary}

      - name: code_panels
        widget: Horizontal
        style: {spacing: 16, width: expand, height: 260}
        children:
          - name: yaml_source
            widget: CodeEditor
            value: "{{ view_source }}"
            style: {width: expand, height: expand, language: yaml, read_only: true}
          - name: python_source
            widget: CodeEditor
            value: "{{ viewmodel_source }}"
            style: {width: expand, height: expand, language: python, read_only: true}
