# Overriding pySilver's built-in M3 type scale.
#
#   type_scale: {source: typescale.yaml}
#
# You do NOT need this file to use type roles. pySilver ships the full M3
# baseline scale, so `style: {text_style: title-large}` works out of the box.
# Entries here override the built-in scale role by role; anything you leave out
# keeps its M3 value.
#
# The built-in figures come from Google's autogenerated token source
# (material-web, tokens/versions/latest/sass/_md-sys-typescale.scss, Material 3
# version 34.0.21), converted from rem at 16px/rem. The spec page itself serves
# a JavaScript shell with no extractable table, which is why the values are
# taken from the generated tokens rather than scraped from the page.
#
# For reference, the built-in sizes in dp:
#   display-large 57   headline-large 32   title-large 22   body-large 16   label-large 14
#   display-medium 45  headline-medium 28  title-medium 16  body-medium 14  label-medium 12
#   display-small 36   headline-small 24   title-small 14   body-small 12   label-small 11

# Example: a denser scale for a compact application.
title-large: 20
body-medium: 13
