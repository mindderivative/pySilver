# The other way a modal dialog can behave -- compare with confirm_dialog.yaml.
#
# `dismissable: false` means a click outside is swallowed and does nothing: the
# parent stays dimmed by the scrim and blocked by the modal, focus cannot leave
# the dialog, and the only way out is one of its own buttons. Use it when the
# user must actually answer.
#
# The default is the other way round -- `dismissable: true` -- where clicking
# outside closes the dialog. That form *needs* an `on_dismiss` handler, because
# `open:` is bound to the application's signal and the runtime closing the
# overlay is only a request. There is deliberately no handler here: nothing can
# dismiss this one, so there is nothing to be told about.
params: [title, body]
name: dialog
widget: Dialog
text: "{{ title }}"
supporting_text: "{{ body }}"
# Not a parameter any more: this view's own ViewModel owns whether
# it is up, so the call site does not have to pass it in.
open: "{{ is_open.get() }}"
style:
  modal: true
  scrim: true
  dismissable: false
children:
  - name: actions
    widget: Horizontal
    style: {width: expand, height: 40, spacing: 8, main_alignment: end}
    children:
      - name: acknowledge
        widget: Button
        classes: action primary
        text: "Got it"
        handlers: {on_click: unlock}
