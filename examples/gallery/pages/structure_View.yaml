# Structure & navigation: how content is organised on a screen, and how a
# user moves between screens.
#
# `name:` lives here, not at the source: call site (see home_View.yaml's
# comment on why) -- this file's own names stay exactly as written.
name: structure
widget: ScrollView
style: {width: expand, height: expand}
children:
  - widget: Vertical
    style: {width: expand, spacing: 28, padding: 24}
    children:
      - widget: Text
        text: "Structure & navigation"
        style: {text_style: headline-small, color: primary}
      - widget: Text
        text: "Lists, expandable and hierarchical content, then the chrome that moves a user between screens -- including the very rail and drawer this page's own navigation is built from."
        style: {color: on_surface_variant, font_size: 15}

      # ============================================================
      # Lists and structure
      # ============================================================
      - widget: Text
        text: "Lists and structure"
        style: {text_style: title-medium, color: primary}
      - widget: Text
        text: "ListItem is 56dp for a one-line row, 72dp with supporting text, 88dp with two lines of it -- height follows content, not a fixed row size. Accordion and TreeView cover a gap in M3's own catalogue: M3 describes lists that 'expand and collapse' but names no dedicated component for either, so pySilver builds the disclosure-widget shape (a button controlling an adjacent region) itself, and TreeView applies the same idea recursively for nested content. Shape is a distance-field polygon, not a rasterised icon -- free to animate its corner radius or side count with no re-rasterisation cost."
        style: {color: on_surface, font_size: 15}
      - {name: structure_div, widget: Divider, style: {width: expand}}
      - name: list_items
        widget: Vertical
        style: {width: expand}
        children:
          - {name: li_one, widget: ListItem, text: "One-line item"}
          - {name: li_two, widget: ListItem, text: "Two-line item", supporting_text: "With supporting text underneath"}
      - name: accordion_demo
        widget: Accordion
        text: "Show details"
        value: "{{ accordion_open.get() }}"
        handlers: {on_click: toggle_accordion}
        children:
          - name: accordion_body
            widget: Text
            text: "The accordion's expand state follows the same value:/on_click: convention as every other selectable control."
            style: {height: 60, color: on_surface_variant}
      - name: tree_demo
        widget: TreeView
        value: "{{ tree_selection.get() }}"
        style: {width: expand}
        children:
          - name: src
            widget: TreeItem
            text: "src"
            value: "{{ tree_src_expanded.get() }}"
            handlers: {on_click: toggle_tree_src}
            children:
              - {name: main, widget: TreeItem, text: "main.py", handlers: {on_click: select_tree}}
              - {name: widgets_dir, widget: TreeItem, text: "widgets/", handlers: {on_click: select_tree}}
          - {name: readme, widget: TreeItem, text: "README.md", handlers: {on_click: select_tree}}
      - name: shapes_row
        widget: Horizontal
        style: {height: 64, spacing: 16, width: expand, cross_alignment: center}
        children:
          - {name: shape_tri, widget: Shape, style: {width: 56, height: 56, sides: 3, background: primary}}
          - {name: shape_pent, widget: Shape, style: {width: 56, height: 56, sides: 5, background: secondary}}
          - {name: shape_hex, widget: Shape, style: {width: 56, height: 56, sides: 6, background: tertiary}}
          - {name: shape_circle, widget: Shape, style: {width: 56, height: 56, sides: 32, background: error}}

      # ============================================================
      # Navigation
      # ============================================================
      - widget: Text
        text: "Navigation"
        style: {text_style: title-medium, color: primary}
      - widget: Text
        text: "TopAppBar anchors a screen's title (small/medium/large per M3's three heights); Tabs switch between peer views at the same level. NavigationRail is one widget with two states -- collapsed (80dp, icon-only) and expanded (240-360dp, with labels) -- that transform into each other; this gallery's own sidebar is built from it. Both states take the same NavItem children and the same value:-by-name selection convention Tabs uses. StatusBar is pySilver's own addition: M3's own vocabulary has no 'status bar' component at all, only a docked toolbar of action buttons, which is a different thing."
        style: {color: on_surface, font_size: 15}
      - {name: navigation_div, widget: Divider, style: {width: expand}}
      - name: top_app_bar_demo
        widget: TopAppBar
        text: "Section title"
        style: {variant: small, width: expand}
      - name: tabs_demo
        widget: Tabs
        value: "{{ tab.get() }}"
        style: {width: expand}
        children:
          - {name: t0, widget: Tab, text: "Overview", handlers: {on_click: select_tab}}
          - {name: t1, widget: Tab, text: "Details",  handlers: {on_click: select_tab}}
          - {name: t2, widget: Tab, text: "History",  handlers: {on_click: select_tab}}
      - name: rail_and_drawer
        widget: Horizontal
        style: {height: 220, spacing: 16, width: expand}
        children:
          - name: rail_demo
            widget: NavigationRail
            value: "{{ rail.get() }}"
            collapsed: "true"
            style: {height: expand}
            children:
              - {name: r0, widget: NavItem, icon: home,     label: "Home",     handlers: {on_click: select_rail}}
              - {name: r1, widget: NavItem, icon: search,   label: "Search",   handlers: {on_click: select_rail}}
              - {name: r2, widget: NavItem, icon: settings, label: "Settings", handlers: {on_click: select_rail}}
          - name: drawer_demo
            widget: NavigationRail
            value: "{{ rail.get() }}"
            collapsed: "false"
            style: {height: expand}
            children:
              - {name: d0, widget: NavItem, icon: home,     label: "Home",     handlers: {on_click: select_rail}}
              - {name: d1, widget: NavItem, icon: search,   label: "Search",   handlers: {on_click: select_rail}}
              - {name: d2, widget: NavItem, icon: settings, label: "Settings", handlers: {on_click: select_rail}}
          - name: status_bar_demo
            widget: Vertical
            style: {width: expand, height: expand}
            children:
              - name: status_bar_filler
                widget: Container
                style: {width: expand, height: expand, background: surface_container_low, corner_radius: 8}
              - name: status_bar
                widget: StatusBar
                style: {width: expand}
                children:
                  - {name: status_lead, widget: Text, text: "Ready"}
                  - {name: status_gap, widget: Spacer, style: {width: expand}}
                  - {name: status_trail, widget: Text, text: "UTF-8"}

      - widget: Text
        text: "Wiring it up in Python"
        style: {text_style: title-medium, color: primary}
      - widget: CodeEditor
        value: |
          class Gallery(ViewModel):
              def __init__(self) -> None:
                  self.tree_selection = Signal("main", name="tree_selection")
                  self.accordion_open = Signal(True, name="accordion_open")

              # A selection container's value: only READS a signal, so its
              # on_click writes the clicked child's own name back into it.
              def select_tree(self, event: Any) -> None:
                  self.tree_selection.set(event.target.name)

              def toggle_accordion(self, event: Any) -> None:
                  self.accordion_open.update(lambda on: not on)
        style: {height: 190, width: expand, language: python, read_only: true}
