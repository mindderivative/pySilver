# Settings: the gallery's own theme, and the toggle for it. Pinned to the
# bottom of the navigation rail/drawer (see gallery_View.yaml).
#
# `name:` lives here, not at the source: call site (see home_View.yaml's
# comment on why) -- this file's own names stay exactly as written.
name: settings
widget: ScrollView
style: {width: expand, height: expand}
children:
  - widget: Vertical
    style: {width: expand, spacing: 20, padding: 24}
    children:
      - widget: Text
        text: "Settings"
        style: {text_style: headline-small, color: primary}
      - widget: Text
        text: "pySilver's whole colour palette -- 59 tokens, light and dark -- derives from one seed colour through Material Design 3's dynamic colour system. Switching schemes is a single palette-buffer upload: no relayout, no display-list rebuild, because every painted element carries a palette index rather than a literal colour."
        style: {color: on_surface_variant, font_size: 15}

      - widget: Divider
        style: {width: expand}

      - widget: Text
        text: "Theme"
        style: {text_style: title-medium, color: primary}

      - name: settings_scheme_row
        widget: Horizontal
        style: {height: 40, spacing: 12, width: expand, cross_alignment: center}
        children:
          - widget: Text
            text: "Scheme:"
            style: {color: on_surface, font_size: 15}
          - widget: Text
            text: "{{ 'Dark' if dark.get() else 'Light' }}"
            style: {color: primary, font_size: 15}

      - name: settings_seed_row
        widget: Horizontal
        style: {height: 40, spacing: 12, width: expand, cross_alignment: center}
        children:
          - widget: Text
            text: "Seed colour:"
            style: {color: on_surface, font_size: 15}
          - widget: Container
            style: {width: 24, height: 24, background: primary, corner_radius: 6}
          - widget: Text
            text: "#6750A4"
            style: {color: on_surface_variant, font_size: 15}

      - name: settings_toggle_row
        widget: Horizontal
        style: {height: 40, spacing: 12, width: expand, cross_alignment: center}
        children:
          - widget: Text
            text: "Dark mode"
            style: {color: on_surface, font_size: 15}
          - widget: Spacer
            style: {width: expand}
          - name: settings_dark_switch
            widget: Switch
            value: "{{ dark.get() }}"
            handlers: {on_click: toggle_theme}

      - widget: Text
        text: "Wiring it up in Python"
        style: {text_style: title-medium, color: primary}
      - widget: CodeEditor
        value: |
          class Gallery(ViewModel):
              def __init__(self) -> None:
                  self.dark = Signal(True, name="dark")

              def toggle_theme(self, event: Any) -> None:
                  # A theme switch is a single palette-buffer upload, which
                  # is why this reaches for self.app rather than staying
                  # inside the view's own state.
                  self.dark.update(lambda on: not on)
                  self.app.set_theme(Theme(seed=SEED, dark=self.dark.peek()))
        style: {height: 150, width: expand, language: python, read_only: true}
